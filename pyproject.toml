[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "storzandbickel-ble"
version = "0.1.20"
description = "Python library for controlling Storz & Bickel devices via Bluetooth Low Energy (BLE)"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
    {name = "lorek123"}
]
keywords = ["ble", "bluetooth", "storz", "bickel", "volcano", "venty", "crafty", "home-assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Floors follow Home Assistant's pinned BLE stack (homeassistant/package_constraints.txt:
# bleak==3.0.2, bleak-retry-connector==4.6.1 as of HA 2026.6/2026.7). This library is
# installed *inside* HA via the storzandbickel integration's manifest requirements, so the
# floors must never exceed what HA pins or pip resolution breaks for users. No upper caps —
# that matches how bleak-retry-connector and bluetooth-adapters declare bleak themselves.
dependencies = [
    "bleak>=3.0.2",
    "bleak-retry-connector>=4.6.1",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-timeout>=2.2.0",
    "sphinx>=7.0.0,<10.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "pre-commit>=3.5.0",
    "bump2version>=1.0.1",
]

[project.urls]
Homepage = "https://github.com/lorek123/snb-ble"
Repository = "https://github.com/lorek123/snb-ble"
Issues = "https://github.com/lorek123/snb-ble/issues"

[tool.hatchling.build]
include = [
    "src/storzandbickel_ble",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
ignore = [
    # This library deliberately swallows broad exceptions around GATT operations:
    # BLE links drop constantly and a failed read must degrade to stale state
    # rather than propagate. Downstream consumers (the ha-snb coordinator) are
    # built on that contract, so these catches must not be narrowed.
    "BLE001",  # Do not catch blind exception
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["storzandbickel_ble"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "bleak.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=storzandbickel_ble",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=58",
]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "experimental: marks tests for experimental features",
]

[tool.coverage.run]
source = ["src/storzandbickel_ble"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

